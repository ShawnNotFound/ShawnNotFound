name: Profile widgets

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["widgets/**", ".github/workflows/widgets.yml"]

permissions:
  contents: write

concurrency:
  group: widgets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "fonttools>=4.50,<5"
      - name: Build widgets
        run: python widgets/build.py
        env:
          # ACTIVITY_TOKEN is optional: a classic token of the profile owner with the read:user scope.
          # Without it, private contributions appear only if the profile's "Private contributions" setting is on.
          GITHUB_TOKEN: ${{ secrets.ACTIVITY_TOKEN || github.token }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Refresh profile widgets" && git push; fi
